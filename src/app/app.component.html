<ion-app>
  <!-- Navigation is for admins only; a disabled menu also hides every ion-menu-button. -->
  <ion-menu contentId="main-content" [disabled]="!auth.isAdmin()">
    <ion-header>
      <ion-toolbar>
        <ion-title>Generations</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        @for (page of pages; track page.url) {
          <ion-menu-toggle [autoHide]="false">
            <ion-item [routerLink]="page.url" routerLinkActive="selected" routerDirection="root" detail="false">
              <ion-icon slot="start" [name]="page.icon" aria-hidden="true"></ion-icon>
              <ion-label>{{ page.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        }
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
