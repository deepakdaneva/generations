<ion-content [scrollX]="false" [scrollY]="false">
  <app-top-actions></app-top-actions>

  <section
    #canvas
    class="tree-canvas"
    [class.dragging]="dragging()"
    [style.background-position]="view().x + 'px ' + view().y + 'px'"
    [style.background-size]="24 * view().z + 'px ' + 24 * view().z + 'px'"
    aria-label="Family tree canvas. Drag or use the arrow keys to move, + and - to zoom."
    tabindex="0"
    (pointerdown)="down($event)"
    (pointermove)="move($event)"
    (pointerup)="up($event)"
    (pointercancel)="up($event)"
    (wheel)="wheel($event)"
    (keydown)="key($event)"
  >
    <div class="world" [style.transform]="'translate(' + view().x + 'px, ' + view().y + 'px) scale(' + view().z + ')'">
      <svg class="lines" aria-hidden="true">
        @for (line of layout()?.lines; track line.id + $index) {
        <path [attr.d]="line.d" pathLength="1"></path>
        }
      </svg>

      @for (h of layout()?.households; track h.id) {
      <div
        class="household"
        [class.open]="open() === h.id"
        [style.transform]="'translate(' + h.x + 'px, ' + h.y + 'px)'"
        (pointerdown)="open.set(h.id)"
      >
        @for (id of h.members; track id; let i = $index) { @if (people().get(id); as person) {
        <app-person-card
          class="node"
          [class.active]="open() === h.id"
          [style.--i]="i"
          [style.z-index]="h.members.length - i"
          [person]="person"
          [canAddParent]="(person.parents?.length ?? 0) < 2"
          (edit)="startEdit(person)"
          (add)="startAdd(person, $event)"
        ></app-person-card>
        } }
      </div>
      }
    </div>

    @if (!layout()) {
    <div class="status">
      @if (loadError()) {
      <ion-text color="danger"><p>{{ loadError() }}</p></ion-text>
      <ion-button (click)="load()">Try again</ion-button>
      } @else {
      <ion-spinner name="crescent" aria-label="Loading your family tree"></ion-spinner>
      }
    </div>
    }
  </section>

  <div class="zoom" slot="fixed">
    <ion-button color="light" (click)="zoomBy(1.25)" aria-label="Zoom in">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
    <ion-button color="light" (click)="zoomBy(0.8)" aria-label="Zoom out">
      <ion-icon slot="icon-only" name="remove"></ion-icon>
    </ion-button>
    <ion-button color="light" (click)="center()" aria-label="Center on me">
      <ion-icon slot="icon-only" name="locate-outline"></ion-icon>
    </ion-button>
  </div>

  <app-person-edit
    [person]="form()?.person ?? null"
    [title]="form()?.title ?? ''"
    [relations]="form()?.relations ?? []"
    [canDelete]="!!form()?.canDelete"
    [busy]="saving()"
    [error]="saveError()"
    (save)="save($event)"
    (unlink)="unlink($event)"
    (remove)="remove()"
    (dismissed)="closeForm()"
  ></app-person-edit>
</ion-content>
